# workflow name
name: Hello

on:
  push:
    paths: "*.py"
    
jobs:
  code-clone:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: install code python linter
        run: pip install ruff
        
      - name: run pyliner
        run: ruff check  


